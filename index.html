<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="余记" />
    <meta name="theme-color" content="#f8f8f2" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/worlds.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <title>Yujournal · 余记</title>
  </head>
  <body class="variant-c">
    <div id="app">
      <div id="voice-download-bar" class="voice-download-bar" role="status" hidden>
        <span id="voice-download-message"></span><button data-action="voice">查看</button
        ><button id="voice-background-pause" data-action="pauseVoice">暂停</button
        ><button id="voice-background-continue" data-action="prepareVoice" hidden>继续</button>
      </div>
      <main id="content" aria-live="polite">
        <div class="empty"><p>正在打开本机账本…</p></div>
      </main>
      <nav id="navigation" aria-label="主导航"></nav>
      <div id="toast" role="status" hidden></div>
    </div>
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <div id="sheet-content"></div>
    </dialog>
    <script src="src/features.js"></script>
    <script src="src/theme-studio.js"></script>
    <script src="src/views.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
